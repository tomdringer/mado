[package]
name = "mado"
version = "0.1.0"
edition = "2024"
default-run = "mado"

[dependencies]
slint = "1"
i-slint-backend-winit = "1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.5"
portable-pty = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
vte = "0.13"
fontdue = "0.9"
font-kit = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
ureq = { version = "2", features = ["native-tls"] }
png = "0.17"
base64 = { version = "0.22", features = ["alloc"] }

[[bin]]
name = "mado-claude"
path = "src/bin/mado_claude.rs"

[build-dependencies]
slint-build = "1"

