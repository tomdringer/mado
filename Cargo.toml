[package]
name = "mado"
version = "0.0.3"
edition = "2024"
default-run = "mado"
license = "MIT"
description = "A macOS-inspired terminal multiplexer with sidebar plugins and integrated task management"

[dependencies]
slint = "1"
i-slint-backend-winit = "1"
portable-pty = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
vte = "0.13"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
png = "0.17"
base64 = { version = "0.22", features = ["alloc"] }
notify = "6"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.5"
font-kit = "0.14"
ureq = { version = "2", features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gdk-sys = "0.18"
gtk-sys = "0.18"
glib-sys = "0.18"
gobject-sys = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[[bin]]
name = "mado-claude"
path = "src/bin/mado_claude.rs"

[[bin]]
name = "mado-webview"
path = "src/bin/mado_webview.rs"

[build-dependencies]
slint-build = "1"

[package.metadata.deb]
name = "mado"
maintainer = "Tom Dringer <tom@nerimasoft.com>"
copyright = "2026 Tom Dringer"
license-file = ["LICENSE", "0"]
extended-description = "A macOS-inspired terminal multiplexer with a sidebar plugin architecture, integrated task management, and a theme system."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/mado",        "usr/bin/",              "755"],
    ["target/release/mado-webview", "usr/bin/",             "755"],
    ["target/release/mado-claude",  "usr/lib/mado/plugins/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mado",         dest = "/usr/bin/mado",                       mode = "755" },
    { source = "target/release/mado-webview",  dest = "/usr/bin/mado-webview",               mode = "755" },
    { source = "target/release/mado-claude",   dest = "/usr/lib/mado/plugins/mado-claude",   mode = "755" },
]

