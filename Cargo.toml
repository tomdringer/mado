[package]
name = "mado"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1"
i-slint-backend-winit = "1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.5"
portable-pty = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
vte = "0.13"
fontdue = "0.9"
font-kit = "0.14"
pathfinder_geometry = "0.5"
core-graphics = "0.23"
core-text = "20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"

[build-dependencies]
slint-build = "1"
