# Tailwind CSS — Lime palette
# https://tailwindcss.com/docs/colors

[meta]
name = "lime"
dark = true

[palette]
"50"  = "#f7fee7"
"100" = "#ecfccb"
"200" = "#d9f99d"
"300" = "#bef264"
"400" = "#a3e635"
"500" = "#84cc16"
"600" = "#65a30d"
"700" = "#4d7c0f"
"800" = "#3f6212"
"900" = "#365314"
"950" = "#1a2e05"

[ui]
window_bg        = "#365314"  # 900
sidebar_bg       = "#365314"  # 900
card_bg          = "#3f6212"  # 800
card_border      = "#4d7c0f"  # 700
terminal_area_bg = "#1a2e05"  # 950
pane_bg          = "#365314"  # 900
pane_toolbar     = "#3f6212"  # 800
focus_border     = "#a3e635"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#a3e635"  # 400
divider_inactive = "#4d7c0f"  # 700
text_primary     = "#ecfccb"  # 100
text_muted       = "#84cc16"  # 500

[terminal]
foreground = "#cccccc"
background = "#3f6212"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"
