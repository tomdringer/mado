# Tailwind CSS — Zinc palette
# https://tailwindcss.com/docs/colors

[meta]
name = "zinc"
dark = true

[palette]
"50"  = "#fafafa"
"100" = "#f4f4f5"
"200" = "#e4e4e7"
"300" = "#d4d4d8"
"400" = "#a1a1aa"
"500" = "#71717a"
"600" = "#52525b"
"700" = "#3f3f46"
"800" = "#27272a"
"900" = "#18181b"
"950" = "#09090b"

[ui]
window_bg        = "#18181b"  # 900
sidebar_bg       = "#18181b"  # 900
card_bg          = "#27272a"  # 800
card_border      = "#3f3f46"  # 700
terminal_area_bg = "#09090b"  # 950
pane_bg          = "#18181b"  # 900
pane_toolbar     = "#27272a"  # 800
focus_border     = "#a1a1aa"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#a1a1aa"  # 400
divider_inactive = "#3f3f46"  # 700
text_primary     = "#f4f4f5"  # 100
text_muted       = "#71717a"  # 500

[terminal]
foreground = "#cccccc"
background = "#27272a"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"
