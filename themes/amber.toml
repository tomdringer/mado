# Tailwind CSS — Amber palette
# https://tailwindcss.com/docs/colors

[meta]
name = "amber"
dark = true

[palette]
"50"  = "#fffbeb"
"100" = "#fef3c7"
"200" = "#fde68a"
"300" = "#fcd34d"
"400" = "#fbbf24"
"500" = "#f59e0b"
"600" = "#d97706"
"700" = "#b45309"
"800" = "#92400e"
"900" = "#78350f"
"950" = "#451a03"

[ui]
window_bg        = "#78350f"  # 900
sidebar_bg       = "#78350f"  # 900
card_bg          = "#92400e"  # 800
card_border      = "#b45309"  # 700
terminal_area_bg = "#451a03"  # 950
pane_bg          = "#78350f"  # 900
pane_toolbar     = "#92400e"  # 800
focus_border     = "#fbbf24"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#fbbf24"  # 400
divider_inactive = "#b45309"  # 700
text_primary     = "#fef3c7"  # 100
text_muted       = "#f59e0b"  # 500

[terminal]
foreground = "#cccccc"
background = "#92400e"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"

[starship]
color_fg0    = "#fef3c7"  # amber-100     — text on all segments
color_bg1    = "#451a03"  # amber-950     — time segment
color_bg3    = "#78350f"  # amber-900     — docker segment
color_blue   = "#92400e"  # amber-800     — language segment
color_aqua   = "#0f766e"  # teal-700  — git segment
color_yellow = "#3730a3"  # indigo-700  — directory segment
color_orange = "#b45309"  # amber-700 (400 too bright for light text)  — os/user segment
color_green  = "#22c55e"  # green-500     — success (semantic)
color_purple = "#6d28d9"  # violet-700  — vim replace
