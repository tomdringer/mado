# Tailwind CSS — Neutral palette
# https://tailwindcss.com/docs/colors

[meta]
name = "neutral"
dark = true

[palette]
"50"  = "#fafafa"
"100" = "#f5f5f5"
"200" = "#e5e5e5"
"300" = "#d4d4d4"
"400" = "#a3a3a3"
"500" = "#737373"
"600" = "#525252"
"700" = "#404040"
"800" = "#262626"
"900" = "#171717"
"950" = "#0a0a0a"

[ui]
window_bg        = "#171717"  # 900
sidebar_bg       = "#171717"  # 900
card_bg          = "#262626"  # 800
card_border      = "#404040"  # 700
terminal_area_bg = "#0a0a0a"  # 950
pane_bg          = "#171717"  # 900
pane_toolbar     = "#262626"  # 800
focus_border     = "#a3a3a3"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#a3a3a3"  # 400
divider_inactive = "#404040"  # 700
text_primary     = "#f5f5f5"  # 100
text_muted       = "#737373"  # 500

[terminal]
foreground = "#cccccc"
background = "#262626"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"
