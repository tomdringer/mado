# Tailwind CSS — Cyan palette
# https://tailwindcss.com/docs/colors

[meta]
name = "cyan"
dark = true

[palette]
"50"  = "#ecfeff"
"100" = "#cffafe"
"200" = "#a5f3fc"
"300" = "#67e8f9"
"400" = "#22d3ee"
"500" = "#06b6d4"
"600" = "#0891b2"
"700" = "#0e7490"
"800" = "#155e75"
"900" = "#164e63"
"950" = "#083344"

[ui]
window_bg        = "#164e63"  # 900
sidebar_bg       = "#164e63"  # 900
card_bg          = "#155e75"  # 800
card_border      = "#0e7490"  # 700
terminal_area_bg = "#083344"  # 950
pane_bg          = "#164e63"  # 900
pane_toolbar     = "#155e75"  # 800
focus_border     = "#22d3ee"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#22d3ee"  # 400
divider_inactive = "#0e7490"  # 700
text_primary     = "#cffafe"  # 100
text_muted       = "#06b6d4"  # 500

[terminal]
foreground = "#cccccc"
background = "#155e75"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"
