# Tailwind CSS — Slate palette
# https://tailwindcss.com/docs/colors

[meta]
name = "slate"
dark = true

[palette]
"50"  = "#f8fafc"
"100" = "#f1f5f9"
"200" = "#e2e8f0"
"300" = "#cbd5e1"
"400" = "#94a3b8"
"500" = "#64748b"
"600" = "#475569"
"700" = "#334155"
"800" = "#1e293b"
"900" = "#0f172a"
"950" = "#020617"

[ui]
window_bg        = "#0f172a"  # 900
sidebar_bg       = "#0f172a"  # 900
card_bg          = "#1e293b"  # 800
card_border      = "#334155"  # 700
terminal_area_bg = "#020617"  # 950
pane_bg          = "#0f172a"  # 900
pane_toolbar     = "#1e293b"  # 800
focus_border     = "#7aa2f7"  # blue-400 (matches approved default)
active_dot       = "#22c55e"  # green-500
divider_active   = "#8888cc"  # matches hardcoded value
divider_inactive = "#3a3a55"  # matches hardcoded value
text_primary     = "#f1f5f9"  # 100
text_muted       = "#64748b"  # 500

[terminal]
foreground = "#cccccc"
background = "#1e2030"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"

[starship]
color_fg0    = "#f1f5f9"  # slate-100     — text on all segments
color_bg1    = "#020617"  # slate-950     — time segment
color_bg3    = "#0f172a"  # slate-900     — docker segment
color_blue   = "#1e293b"  # slate-800     — language segment
color_aqua   = "#0f766e"  # teal-700  — git segment
color_yellow = "#b45309"  # amber-700  — directory segment
color_orange = "#475569"  # slate-600  — os/user segment
color_green  = "#22c55e"  # green-500     — success (semantic)
color_purple = "#6d28d9"  # violet-700  — vim replace
