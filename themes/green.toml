# Tailwind CSS — Green palette
# https://tailwindcss.com/docs/colors

[meta]
name = "green"
dark = true

[palette]
"50"  = "#f0fdf4"
"100" = "#dcfce7"
"200" = "#bbf7d0"
"300" = "#86efac"
"400" = "#4ade80"
"500" = "#22c55e"
"600" = "#16a34a"
"700" = "#15803d"
"800" = "#166534"
"900" = "#14532d"
"950" = "#052e16"

[ui]
window_bg        = "#14532d"  # 900
sidebar_bg       = "#14532d"  # 900
card_bg          = "#166534"  # 800
card_border      = "#15803d"  # 700
terminal_area_bg = "#052e16"  # 950
pane_bg          = "#14532d"  # 900
pane_toolbar     = "#166534"  # 800
focus_border     = "#4ade80"  # 400
active_dot       = "#4ade80"  # 400 (same family)
divider_active   = "#4ade80"  # 400
divider_inactive = "#15803d"  # 700
text_primary     = "#dcfce7"  # 100
text_muted       = "#22c55e"  # 500

[terminal]
foreground = "#cccccc"
background = "#166534"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"

[starship]
color_fg0    = "#dcfce7"  # green-100     — text on all segments
color_bg1    = "#052e16"  # green-950     — time segment
color_bg3    = "#14532d"  # green-900     — docker segment
color_blue   = "#166534"  # green-800     — language segment
color_aqua   = "#3730a3"  # indigo-700 (green-family: avoid teal)  — git segment
color_yellow = "#b45309"  # amber-700  — directory segment
color_orange = "#16a34a"  # green-600  — os/user segment
color_green  = "#22c55e"  # green-500     — success (semantic)
color_purple = "#6d28d9"  # violet-700  — vim replace
