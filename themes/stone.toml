# Tailwind CSS — Stone palette
# https://tailwindcss.com/docs/colors

[meta]
name = "stone"
dark = true

[palette]
"50"  = "#fafaf9"
"100" = "#f5f5f4"
"200" = "#e7e5e4"
"300" = "#d6d3d1"
"400" = "#a8a29e"
"500" = "#78716c"
"600" = "#57534e"
"700" = "#44403c"
"800" = "#292524"
"900" = "#1c1917"
"950" = "#0c0a09"

[ui]
window_bg        = "#1c1917"  # 900
sidebar_bg       = "#1c1917"  # 900
card_bg          = "#292524"  # 800
card_border      = "#44403c"  # 700
terminal_area_bg = "#0c0a09"  # 950
pane_bg          = "#1c1917"  # 900
pane_toolbar     = "#292524"  # 800
focus_border     = "#a8a29e"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#a8a29e"  # 400
divider_inactive = "#44403c"  # 700
text_primary     = "#f5f5f4"  # 100
text_muted       = "#78716c"  # 500

[terminal]
foreground = "#cccccc"
background = "#292524"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"
