# Tailwind CSS — Stone palette
# https://tailwindcss.com/docs/colors

[meta]
name = "stone"
dark = true

[palette]
"50"  = "#fafaf9"
"100" = "#f5f5f4"
"200" = "#e7e5e4"
"300" = "#d6d3d1"
"400" = "#a8a29e"
"500" = "#78716c"
"600" = "#57534e"
"700" = "#44403c"
"800" = "#292524"
"900" = "#1c1917"
"950" = "#0c0a09"

[ui]
window_bg        = "#1c1917"  # 900
sidebar_bg       = "#1c1917"  # 900
card_bg          = "#292524"  # 800
card_border      = "#44403c"  # 700
terminal_area_bg = "#0c0a09"  # 950
pane_bg          = "#1c1917"  # 900
pane_toolbar     = "#292524"  # 800
focus_border     = "#a8a29e"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#a8a29e"  # 400
divider_inactive = "#44403c"  # 700
text_primary     = "#f5f5f4"  # 100
text_muted       = "#78716c"  # 500

[terminal]
foreground = "#cccccc"
background = "#292524"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"

[starship]
color_fg0    = "#f5f5f4"  # stone-100     — text on all segments
color_bg1    = "#0c0a09"  # stone-950     — time segment
color_bg3    = "#1c1917"  # stone-900     — docker segment
color_blue   = "#292524"  # stone-800     — language segment
color_aqua   = "#0f766e"  # teal-700  — git segment
color_yellow = "#b45309"  # amber-700  — directory segment
color_orange = "#57534e"  # stone-600  — os/user segment
color_green  = "#22c55e"  # green-500     — success (semantic)
color_purple = "#6d28d9"  # violet-700  — vim replace
