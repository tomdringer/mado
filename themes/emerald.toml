# Tailwind CSS — Emerald palette
# https://tailwindcss.com/docs/colors

[meta]
name = "emerald"
dark = true

[palette]
"50"  = "#ecfdf5"
"100" = "#d1fae5"
"200" = "#a7f3d0"
"300" = "#6ee7b7"
"400" = "#34d399"
"500" = "#10b981"
"600" = "#059669"
"700" = "#047857"
"800" = "#065f46"
"900" = "#064e3b"
"950" = "#022c22"

[ui]
window_bg        = "#064e3b"  # 900
sidebar_bg       = "#064e3b"  # 900
card_bg          = "#065f46"  # 800
card_border      = "#047857"  # 700
terminal_area_bg = "#022c22"  # 950
pane_bg          = "#064e3b"  # 900
pane_toolbar     = "#065f46"  # 800
focus_border     = "#34d399"  # 400
active_dot       = "#34d399"  # 400 (same family)
divider_active   = "#34d399"  # 400
divider_inactive = "#047857"  # 700
text_primary     = "#d1fae5"  # 100
text_muted       = "#10b981"  # 500

[terminal]
foreground = "#cccccc"
background = "#065f46"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"

[starship]
color_fg0    = "#d1fae5"  # emerald-100     — text on all segments
color_bg1    = "#022c22"  # emerald-950     — time segment
color_bg3    = "#064e3b"  # emerald-900     — docker segment
color_blue   = "#065f46"  # emerald-800     — language segment
color_aqua   = "#3730a3"  # indigo-700 (green-family: avoid teal)  — git segment
color_yellow = "#b45309"  # amber-700  — directory segment
color_orange = "#059669"  # emerald-600  — os/user segment
color_green  = "#22c55e"  # green-500     — success (semantic)
color_purple = "#6d28d9"  # violet-700  — vim replace
