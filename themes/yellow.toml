# Tailwind CSS — Yellow palette
# https://tailwindcss.com/docs/colors

[meta]
name = "yellow"
dark = true

[palette]
"50"  = "#fefce8"
"100" = "#fef9c3"
"200" = "#fef08a"
"300" = "#fde047"
"400" = "#facc15"
"500" = "#eab308"
"600" = "#ca8a04"
"700" = "#a16207"
"800" = "#854d0e"
"900" = "#713f12"
"950" = "#422006"

[ui]
window_bg        = "#713f12"  # 900
sidebar_bg       = "#713f12"  # 900
card_bg          = "#854d0e"  # 800
card_border      = "#a16207"  # 700
terminal_area_bg = "#422006"  # 950
pane_bg          = "#713f12"  # 900
pane_toolbar     = "#854d0e"  # 800
focus_border     = "#facc15"  # 400
active_dot       = "#22c55e"  # green-500
divider_active   = "#facc15"  # 400
divider_inactive = "#a16207"  # 700
text_primary     = "#fef9c3"  # 100
text_muted       = "#eab308"  # 500

[terminal]
foreground = "#cccccc"
background = "#854d0e"

[terminal.ansi]
black          = "#1e2030"
red            = "#f7768e"
green          = "#9ece6a"
yellow         = "#e0af68"
blue           = "#7aa2f7"
magenta        = "#bb9af7"
cyan           = "#7dcfff"
white          = "#c0caf5"
bright_black   = "#464858"
bright_red     = "#ff9eb6"
bright_green   = "#c6f692"
bright_yellow  = "#ffd790"
bright_blue    = "#a2caff"
bright_magenta = "#e3c2ff"
bright_cyan    = "#a5f7ff"
bright_white   = "#e8f2ff"
